<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lavi's Teacher App</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Poppins', -apple-system, sans-serif; background: #f0ede8; color: #2e2e2e; direction: rtl; min-height: 100vh; }
.page { max-width: 880px; margin: 0 auto; padding: 0 0 3rem; }
.app-header { background: #025db8; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 0; }
.logo { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 24px; color: #fff; line-height: 1.1; }
.logo span { display: block; }
.logo .lavi { padding-right: 20px; }
.header-right { text-align: left; direction: ltr; }
.header-title { color: #fff; font-family: 'League Spartan', sans-serif; font-size: 15px; font-weight: 600; }
.header-sub { color: rgba(255,255,255,0.65); font-size: 12px; margin-top: 2px; }

/* ── ONGLETS ── */
.tabs-bar { background: #025db8; padding: 0 1.5rem; display: flex; gap: 4px; border-top: 1px solid rgba(255,255,255,0.15); }
.tab-btn { padding: 10px 18px; font-family: 'League Spartan', sans-serif; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.65); background: transparent; border: none; border-bottom: 3px solid transparent; cursor: pointer; transition: color .15s, border-color .15s; white-space: nowrap; }
.tab-btn:hover { color: rgba(255,255,255,0.9); }
.tab-btn.active { color: #fff; border-bottom-color: #f55700; }
.tabs-content { margin-top: 1.5rem; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.content { padding: 0 1.25rem; }
.card { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.15); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }

/* ── LOGIN ── */
.login-card { max-width: 460px; margin: 2rem auto; text-align: center; }
.login-title { font-family: 'League Spartan', sans-serif; font-size: 20px; font-weight: 700; color: #025db8; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: #888; margin-bottom: 1.25rem; direction: ltr; }
.email-row { display: flex; gap: 10px; direction: ltr; }
.email-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 0.5px solid rgba(2,93,184,0.3); font-family: 'Poppins', sans-serif; font-size: 14px; color: #2e2e2e; background: #fff; direction: ltr; }
.email-input:focus { outline: none; border-color: #025db8; }
.btn-blue { padding: 10px 22px; border-radius: 8px; border: none; background: #025db8; color: #fff; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-blue:hover { background: #014fa0; }
.btn-blue:disabled { background: #aaa; cursor: not-allowed; }
.dev-banner { background: #f8cf3e; color: #2e2e2e; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 500; margin-bottom: 1rem; direction: ltr; }
.btn-logout { padding: 5px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: rgba(255,255,255,0.85); font-family: 'Poppins', sans-serif; font-size: 12px; cursor: pointer; transition: background .15s; white-space: nowrap; }
.btn-logout:hover { background: rgba(255,255,255,0.12); }
.btn-ghost { padding: 8px 16px; border-radius: 8px; border: 0.5px solid rgba(2,93,184,0.3); background: transparent; color: #025db8; font-family: 'Poppins', sans-serif; font-size: 13px; cursor: pointer; }
.btn-ghost:hover { background: rgba(2,93,184,0.05); }

/* ── ONGLET 1 : SIKKUM ── */
.prof-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.prof-name { font-family: 'League Spartan', sans-serif; font-size: 22px; font-weight: 700; color: #025db8; }
.prof-meta { font-size: 13px; color: #888; margin-top: 3px; }
.classe-block { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.15); border-radius: 12px; margin-bottom: 0.75rem; overflow: hidden; transition: border-color .2s; }
.classe-block.sent { border-color: #1d8653; }
.classe-block.open { border-color: #025db8; box-shadow: 0 2px 12px rgba(2,93,184,0.1); }
.classe-header { background: #025db8; padding: 0.85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; cursor: pointer; user-select: none; transition: background .2s; }
.classe-block.sent .classe-header { background: #1d8653; }
.classe-header:hover { filter: brightness(1.08); }
.classe-header-left { display: flex; align-items: center; gap: 10px; }
.classe-title { font-family: 'League Spartan', sans-serif; font-size: 18px; font-weight: 700; color: #fff; }
.classe-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-block; background: rgba(255,255,255,0.2); color: #fff; border-radius: 20px; font-size: 11px; padding: 2px 10px; }
.tag-sent { background: rgba(255,255,255,0.35); font-weight: 700; }
.tag-edit { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.25); color: #fff; font-size: 12px; cursor: pointer; transition: background .15s; }
.tag-edit:hover { background: rgba(255,255,255,0.45); }
.chevron { color: rgba(255,255,255,0.8); font-size: 18px; transition: transform .25s; flex-shrink: 0; }
.classe-block.open .chevron { transform: rotate(180deg); }
.classe-body { display: none; }
.classe-block.open .classe-body { display: block; }
.infos-classe { padding: 1rem 1.25rem; border-bottom: 0.5px solid rgba(2,93,184,0.1); }
.infos-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.infos-full { grid-column: 1 / -1; }
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 12px; color: #888; font-weight: 500; }
.field-input { padding: 8px 10px; border-radius: 8px; border: 0.5px solid rgba(2,93,184,0.2); font-family: 'Poppins', sans-serif; font-size: 13px; color: #2e2e2e; background: #fff; direction: rtl; }
.field-input:focus { outline: none; border-color: #025db8; }
textarea.field-input { min-height: 58px; resize: vertical; }
input[type=number].field-input { max-width: 80px; text-align: center; direction: ltr; }
.students-wrap { overflow-x: auto; }
table.students { width: 100%; border-collapse: collapse; direction: rtl; }
.students th { padding: 9px 14px; font-size: 12px; font-weight: 500; color: #888; text-align: right; background: #f5f2ee; border-bottom: 0.5px solid rgba(2,93,184,0.1); }
.students td { padding: 9px 14px; border-bottom: 0.5px solid rgba(2,93,184,0.07); vertical-align: top; }
.students tr:last-child td { border-bottom: none; }
.student-name { font-size: 14px; font-weight: 500; color: #2e2e2e; }
.badge-pres { display: inline-block; border-radius: 20px; font-size: 12px; font-weight: 500; padding: 2px 10px; background: rgba(2,93,184,0.1); color: #025db8; }
.badge-unknown { background: #eee; color: #aaa; }
textarea.eval { width: 100%; min-height: 48px; padding: 6px 8px; border-radius: 8px; border: 0.5px solid rgba(2,93,184,0.2); font-family: 'Poppins', sans-serif; font-size: 12px; resize: vertical; direction: rtl; color: #2e2e2e; background: #fff; }
textarea.eval:focus { outline: none; border-color: #025db8; }
select.passage { padding: 6px 8px; border-radius: 8px; border: 0.5px solid rgba(2,93,184,0.2); font-family: 'Poppins', sans-serif; font-size: 12px; background: #fff; direction: rtl; color: #2e2e2e; width: 100%; }
select.passage:focus { outline: none; border-color: #025db8; }
.class-submit-area { padding: 1rem 1.25rem; border-top: 0.5px solid rgba(2,93,184,0.1); display: flex; align-items: center; justify-content: space-between; gap: 12px; direction: ltr; }
.btn-submit-class { padding: 11px 28px; border-radius: 10px; border: none; background: #f55700; color: #fff; font-family: 'League Spartan', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; white-space: nowrap; }
.btn-submit-class:hover { background: #d94a00; }
.btn-submit-class:disabled { background: #bbb; cursor: not-allowed; }
.btn-submit-class.done { background: #1d8653; cursor: default; }
.submit-class-note { font-size: 12px; color: #aaa; }

/* ── ONGLET 3 : נוכחות (présence) ── */
.pres-students { display: flex; flex-direction: column; }
.pres-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 0.5px solid rgba(2,93,184,0.07); font-size: 14px; color: #2e2e2e; cursor: pointer; }
.pres-row:last-child { border-bottom: none; }
.pres-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #025db8; cursor: pointer; flex-shrink: 0; }

/* ── ONGLET 2 : BAKASHA ── */
.bakasha-card { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.15); border-radius: 12px; padding: 2rem 1.75rem; max-width: 680px; margin: 0 auto; }
.bakasha-title { font-family: 'League Spartan', sans-serif; font-size: 20px; font-weight: 700; color: #025db8; margin-bottom: 4px; }
.bakasha-sub { font-size: 13px; color: #888; margin-bottom: 1.75rem; direction: ltr; }
.bakasha-fields { display: flex; flex-direction: column; gap: 1.1rem; }
.bakasha-field { display: flex; flex-direction: column; gap: 5px; }
.bakasha-label { font-size: 13px; font-weight: 600; color: #2e2e2e; }
.bakasha-hint { font-size: 11px; color: #aaa; margin-top: 1px; }
.bakasha-input { padding: 9px 12px; border-radius: 8px; border: 0.5px solid rgba(2,93,184,0.2); font-family: 'Poppins', sans-serif; font-size: 13px; color: #2e2e2e; background: #fff; direction: rtl; width: 100%; }
.bakasha-input:focus { outline: none; border-color: #025db8; box-shadow: 0 0 0 3px rgba(2,93,184,0.08); }
textarea.bakasha-input { min-height: 80px; resize: vertical; }
.bakasha-teacher-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: rgba(2,93,184,0.05); border: 0.5px solid rgba(2,93,184,0.15); direction: ltr; }
.bakasha-teacher-email { font-size: 13px; color: #025db8; font-weight: 500; }
.bakasha-teacher-lock { font-size: 14px; }
.bakasha-submit-area { margin-top: 1.75rem; display: flex; align-items: center; justify-content: space-between; direction: ltr; gap: 12px; }
.btn-submit-bakasha { padding: 12px 32px; border-radius: 10px; border: none; background: #f55700; color: #fff; font-family: 'League Spartan', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; }
.btn-submit-bakasha:hover { background: #d94a00; }
.btn-submit-bakasha:disabled { background: #bbb; cursor: not-allowed; }
.bakasha-note { font-size: 12px; color: #aaa; direction: rtl; }
.bakasha-success { text-align: center; padding: 3rem 1rem; direction: ltr; }
.bakasha-success .success-icon { font-size: 44px; margin-bottom: 1rem; }
.bakasha-success h2 { font-family: 'League Spartan', sans-serif; font-size: 20px; font-weight: 700; color: #1d8653; margin-bottom: 8px; }
.bakasha-success p { font-size: 14px; color: #666; }

/* ── ACCUEIL ── */
.welcome-screen { max-width: 700px; margin: 2.5rem auto; text-align: center; }
.welcome-name { font-family: 'League Spartan', sans-serif; font-size: 24px; font-weight: 700; color: #025db8; margin-bottom: 4px; }
.welcome-sub { font-size: 13px; color: #888; margin-bottom: 2rem; direction: ltr; }
.welcome-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
.welcome-card { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.2); border-radius: 14px; padding: 2rem 1.5rem; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; text-align: center; }
.welcome-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(2,93,184,0.12); border-color: #025db8; }
.welcome-card-icon { font-size: 36px; margin-bottom: 0.75rem; }
.welcome-card-title { font-family: 'League Spartan', sans-serif; font-size: 16px; font-weight: 700; color: #2e2e2e; margin-bottom: 6px; }
.welcome-card-desc { font-size: 12px; color: #888; line-height: 1.5; direction: ltr; }

/* ── ONGLET 4 : ANNUAIRE ── */
.annuaire-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.annuaire-card { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.15); border-radius: 12px; padding: 1rem; text-align: center; transition: box-shadow .15s, border-color .15s; }
.annuaire-card:hover { box-shadow: 0 4px 16px rgba(2,93,184,0.1); border-color: #025db8; }
.annuaire-photo { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: block; }
.annuaire-photo-placeholder { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: #025db8; color: #fff; font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 24px; }
.annuaire-name { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 15px; color: #2e2e2e; margin-bottom: 2px; }
.annuaire-role { font-size: 12px; color: #025db8; font-weight: 500; margin-bottom: 8px; }
.annuaire-meta { font-size: 12px; color: #888; margin-bottom: 3px; direction: ltr; }
.annuaire-status { display: inline-block; border-radius: 20px; font-size: 10px; font-weight: 600; padding: 2px 9px; margin-top: 6px; }
.annuaire-status.active { background: rgba(29,134,83,0.12); color: #1d8653; }
.annuaire-status.inactive { background: #eee; color: #aaa; }
.annuaire-empty { text-align: center; color: #888; padding: 2rem; font-size: 13px; }
.annuaire-booking { display: inline-block; margin-top: 10px; padding: 7px 16px; border-radius: 20px; background: #f55700; color: #fff; font-family: 'League Spartan', sans-serif; font-size: 12px; font-weight: 700; text-decoration: none; transition: background .15s; }
.annuaire-booking:hover { background: #d94a00; }

/* ── ONGLET 5 : VOS CLASSES ── */
.mesclasses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mesclasses-card { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.15); border-radius: 12px; overflow: hidden; transition: box-shadow .15s, border-color .15s; }
.mesclasses-card:hover { box-shadow: 0 4px 16px rgba(2,93,184,0.1); border-color: #025db8; }
.mesclasses-head { background: #025db8; padding: 0.85rem 1.1rem; }
.mesclasses-title { font-family: 'League Spartan', sans-serif; font-size: 17px; font-weight: 700; color: #fff; }
.mesclasses-autoid { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; direction: ltr; }
.mesclasses-body { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 7px; }
.mesclasses-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.mesclasses-row-label { color: #888; }
.mesclasses-row-value { color: #2e2e2e; font-weight: 500; text-align: left; direction: ltr; }
.mesclasses-status { display: inline-block; border-radius: 20px; font-size: 11px; font-weight: 600; padding: 2px 10px; }
.mesclasses-status.complete { background: rgba(29,134,83,0.12); color: #1d8653; }
.mesclasses-status.inprogress { background: rgba(2,93,184,0.12); color: #025db8; }
.mesclasses-status.upcoming { background: rgba(248,207,62,0.25); color: #a07d00; }
.mesclasses-status.creation { background: #eee; color: #999; }
.mesclasses-fiche { display: inline-block; margin-top: 4px; padding: 7px 14px; border-radius: 20px; background: #f55700; color: #fff; font-family: 'League Spartan', sans-serif; font-size: 12px; font-weight: 700; text-decoration: none; text-align: center; }
.mesclasses-fiche:hover { background: #d94a00; }
.points-card { direction: ltr; margin-bottom: 1.5rem; }
.points-title { font-family: 'League Spartan', sans-serif; font-size: 18px; font-weight: 700; color: #025db8; margin-bottom: 12px; }
.points-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
.points-list li { font-size: 13px; color: #2e2e2e; line-height: 1.5; padding-right: 0; padding-left: 22px; position: relative; }
.points-list li::before { content: "•"; color: #f55700; font-weight: 700; position: absolute; left: 0; top: 0; }
.contact-subtitle { font-family: 'League Spartan', sans-serif; font-size: 15px; font-weight: 700; color: #2e2e2e; margin-bottom: 10px; }
.contact-table-wrap { overflow-x: auto; }
table.contact-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.contact-table th { padding: 8px 12px; font-weight: 600; color: #888; text-align: left; background: #f5f2ee; border-bottom: 0.5px solid rgba(2,93,184,0.1); white-space: nowrap; }
.contact-table td { padding: 8px 12px; border-bottom: 0.5px solid rgba(2,93,184,0.07); color: #2e2e2e; }
.contact-table tr:last-child td { border-bottom: none; }

@media (max-width: 680px) { .welcome-cards { grid-template-columns: 1fr; } }

/* ── SHARED ── */
.loading { text-align: center; padding: 3rem 1rem; color: #888; font-size: 14px; direction: ltr; }
.spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid #ddd; border-top-color: #025db8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: #fff0f0; color: #c00; border: 0.5px solid #fcc; border-radius: 8px; padding: 12px 16px; font-size: 13px; margin: 0.75rem 0; direction: ltr; }
.success-screen { background: #FFF9F2; border: 0.5px solid rgba(2,93,184,0.15); border-radius: 12px; padding: 3rem 2rem; text-align: center; direction: ltr; }
.success-icon { font-size: 44px; margin-bottom: 1rem; }
.success-screen h2 { font-family: 'League Spartan', sans-serif; font-size: 22px; font-weight: 700; color: #025db8; margin-bottom: 8px; }
.success-screen p { font-size: 14px; color: #666; }
@media (max-width: 600px) {
  .infos-grid { grid-template-columns: 1fr; }
  .students th:nth-child(3), .students td:nth-child(3) { display: none; }
  .app-header { padding: 0.85rem 1rem; }
  .login-card { margin: 1.5rem auto; padding: 2rem 1.25rem; }
  .tabs-bar { padding: 0 0.75rem; }
  .tab-btn { padding: 10px 12px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="app-header">
    <div class="logo">
      <span>Oulpan</span>
      <span class="lavi">Lavi</span>
    </div>
    <div id="header-right" class="header-right">
      <div class="header-title">Lavi's Teacher App</div>
      <div class="header-sub">Présences, Bilans, etc.</div>
    </div>
  </div>
  <div id="tabs-bar" class="tabs-bar" style="display:none;">
    <button class="tab-btn active" onclick="switchTab('sikkum')">📋 דוח סיום שנה</button>
    <button class="tab-btn" onclick="switchTab('bakasha')">📝 בקשות לשנה הבאה</button>
    <button class="tab-btn" onclick="switchTab('presence')">✅ נוכחות</button>
    <button class="tab-btn" onclick="switchTab('annuaire')">👥 אנשי צוות</button>
    <button class="tab-btn" onclick="switchTab('mesclasses')">🏫 הכיתות שלי</button>
  </div>
  <div class="content">
    <div id="root"></div>
    <div id="tabs-content" class="tabs-content" style="display:none;">
      <div id="tab-sikkum" class="tab-panel active"></div>
      <div id="tab-bakasha" class="tab-panel"></div>
      <div id="tab-presence" class="tab-panel"></div>
      <div id="tab-annuaire" class="tab-panel"></div>
      <div id="tab-mesclasses" class="tab-panel"></div>
    </div>
  </div>
</div>

<script>
const BASE_COURS        = 'appNbwmEyVQsXA25U';
const BASE_PRESENCE     = 'appkhAfrnk3fafBwM';
const TABLE_TEACHERS    = 'tbl6i9FU406js7Edw';
const TABLE_CLASSES     = 'tblTs7XeOJbkEcSf1';
const TABLE_STUDENTS    = 'tblnFCt3Ne5oHwhlr';
const TABLE_PRESENCE    = 'tblVpk0mZAYBAuCGG';
const TABLE_RAPPORTS    = 'tblpXR4YXdAhqlCqA';
const TABLE_BAKASHA     = 'tblB5HHBdDDQbn0Hc';
const TABLE_PRESENCES_JOUR = 'tblDbn6AT04csXvWd'; // table "Présence" (base Cours 5786) — saisie quotidienne par les profs
const AIRTABLE_KEY      = 'patQN9qTSmLV5aKkl.27894395be4f0d150d7d26f35598c9e9fefdef6ee976dbad3dfecb9464a602f8';

// Champs de TABLE_PRESENCES_JOUR (lecture/écriture par ID de champ, avec returnFieldsByFieldId=true)
const FLD_PRES_ELEVE   = 'fldB3PvFigjgvYmWM'; // Elève (link -> Students)
const FLD_PRES_CLASSE  = 'fldVLXXtLgaVuEwAo'; // Classes (texte, numéro de classe)
const FLD_PRES_DATE    = 'fldMOUWRqgoR0rYe7'; // Date (dateTime)
const FLD_PRES_PRESENT = 'fld6XD60QTpapL0Jq'; // Présente (checkbox)
const FLD_PRES_PROF    = 'fldS9wwl4L5TtJ44z'; // Prof (texte, nom de la personne qui a rempli)

// Champs additionnels de TABLE_CLASSES pour l'onglet "Vos classes"

// ── API ──
async function api(base, table, params='', method='GET', body=null) {
  const url = `https://api.airtable.com/v0/${base}/${table}${params}`;
  const opts = { method: method || 'GET', headers: { 'Authorization': 'Bearer ' + AIRTABLE_KEY, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(JSON.stringify(data));
  return data;
}

async function getAll(base, table, params='') {
  let records=[], offset=null;
  do {
    let url = params || '';
    if (offset) url = url ? `${url}&offset=${offset}` : `?offset=${offset}`;
    const data = await api(base, table, url);
    records = records.concat(data.records || []);
    offset = data.offset || null;
  } while(offset);
  return records;
}

    </div>
  `);
  initGoogleSignIn();

function initGoogleSignIn() {
  if (!window.google || !window.google.accounts || !window.google.accounts.id) {
    setTimeout(initGoogleSignIn, 200);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential
  });
  const btnContainer = document.getElementById('google-signin-btn');
  if (btnContainer) {
    google.accounts.id.renderButton(btnContainer, {
      theme: 'filled_blue',
      size: 'large',
      shape: 'pill',
      text: 'signin_with',
      locale: 'he'
    });
  }
}

function decodeJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(
    atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
  );
  return JSON.parse(jsonPayload);
}

async function handleGoogleCredential(response) {
  try {
    const payload = decodeJwt(response.credential);
    const email = (payload.email || '').trim().toLowerCase();

    if (payload.email_verified === false) {
      renderLogin('חשבון הגוגל שלך אינו מאומת.');
      return;
    }

    const domain = email.split('@')[1] || '';
    if (domain !== ALLOWED_DOMAIN) {
      renderLogin(`יש להתחבר עם חשבון @${ALLOWED_DOMAIN} בלבד.`);
      return;
    }

    await loginByEmail(email);
  } catch (e) {
    renderLogin('שגיאה בהתחברות: ' + e.message);
  }
}

function logout() {
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
  init();
}

async function loginByEmail(emailArg) {
  const email = (emailArg || '').trim().toLowerCase();
  if (!email) return;
  loading('מתחבר...');
  try {
    const recs  = await getAll(BASE_COURS, TABLE_TEACHERS, '');
    const found = recs.find(r => (r.fields['Email'] || '').trim().toLowerCase() === email);
    if (!found) {
      renderLogin('החשבון שלך מזוהה אך אינו רשום כמורה במערכת. אנא פנה/י להנהלה.');
      return;
    }
    state.teacher = { id: found.id, name: (found.fields['Name'] || '').trim(), email: found.fields['Email'] || '', classIds: found.fields['Classes 5786'] || [] };
    if (!state.teacher.classIds.length) { renderLogin('לא נמצאו כיתות עבור משתמש זה.'); return; }
    renderHeaderUser(state.teacher);
    renderWelcome();
  } catch(e) { setRoot(`<div class="error-msg">Erreur : ${e.message}</div>`); }
}

// ── CHARGEMENT ──
async function loadClasses(targetTab) {
  if (!state.teacher || classesLoading) return;
  const mySession = sessionId;
  classesLoading = true;
  loading('Chargement de vos classes...');
  try {
    state.classes = []; state.students = {};
    for (const cid of state.teacher.classIds) {
      if (mySession !== sessionId) return; // déconnexion pendant le chargement
      const cls = await api(BASE_COURS, TABLE_CLASSES, `/${cid}`);
      const f = cls.fields;
      if (!['Complete', 'In Progress'].includes(f['Status'])) continue;
      state.classes.push({ id: cid, num: f['Numéro de Classe'] || f['Name'] || cid, chapitre: f['Chapitre en cours'] || '', niveau: f['Niveau'] || '', studentIds: f['Students'] || [] });
    }
    const allStudentIds = [...new Set(state.classes.flatMap(c => c.studentIds))];
    for (let i = 0; i < allStudentIds.length; i += 10) {
      if (mySession !== sessionId) return;
      const batch = allStudentIds.slice(i, i + 10);
      const formula = encodeURIComponent(`OR(${batch.map(id => `RECORD_ID()="${id}"`).join(',')})`);
      const res = await api(BASE_COURS, TABLE_STUDENTS, `?filterByFormula=${formula}`);
      for (const r of (res.records || [])) state.students[r.id] = (r.fields['Name'] || r.id).trim();
    }
    if (mySession !== sessionId) return;
    loading('Chargement des présences...');
    state.presences = {};
    for (const cls of state.classes) {
      if (mySession !== sessionId) return;
      const formula = encodeURIComponent(`{Classe}="${cls.num}"`);
      const res = await getAll(BASE_PRESENCE, TABLE_PRESENCE, `?filterByFormula=${formula}`);
      for (const r of res) {
        const n = (r.fields['Name'] || '').trim();
        if (n) state.presences[`${n}__${cls.num}`] = r.fields['Nombre de présences'] || 0;
      }
    }

    // ── vérifier dans TABLE_RAPPORTS quelles classes ont déjà été envoyées, et garder les enregistrements complets (pour édition ultérieure) ──
    if (mySession !== sessionId || !state.teacher) return;
    loading('Vérification des rapports existants...');
    sentClasses = {};
    state.rapportRecords = {};
    const teacherName = state.teacher.name;
    const formula = encodeURIComponent(`{Prof}="${teacherName}"`);
    const rapports = await getAll(BASE_COURS, TABLE_RAPPORTS, `?filterByFormula=${formula}&returnFieldsByFieldId=true`);
    for (const cls of state.classes) {
      const recs = rapports.filter(r => String(r.fields['fld5pPY7sfAzWNFJB'] || '').trim() === String(cls.num).trim());
      if (recs.length) {
        sentClasses[cls.id] = 'sent';
        state.rapportRecords[cls.id] = recs;
      }
    }

    // ── vérifier les présences déjà enregistrées aujourd'hui (une seule requête pour toutes les classes) ──
    if (mySession !== sessionId) return;
    loading('Vérification des présences du jour...');
    state.presenceRecordsToday = {};
    const todayStr = getTodayStr();
    if (state.classes.length) {
      const orParts = state.classes.map(c => `{Classes}="${String(c.num).replace(/"/g,'\\"')}"`).join(',');
      const formulaPres = encodeURIComponent(`AND(IS_SAME({Date},"${todayStr}",'day'),OR(${orParts}))`);
      const presRecs = await getAll(BASE_COURS, TABLE_PRESENCES_JOUR, `?filterByFormula=${formulaPres}&returnFieldsByFieldId=true`);
      const numToClassId = {};
      state.classes.forEach(c => { numToClassId[String(c.num).trim()] = c.id; });
      for (const r of presRecs) {
        const classNum = String(r.fields[FLD_PRES_CLASSE] || '').trim();
        const classId = numToClassId[classNum];
        if (!classId) continue;
        const sid = (r.fields[FLD_PRES_ELEVE] || [])[0];
        if (!sid) continue;
        if (!state.presenceRecordsToday[classId]) state.presenceRecordsToday[classId] = {};
        state.presenceRecordsToday[classId][sid] = { recordId: r.id, present: !!r.fields[FLD_PRES_PRESENT] };
      }
    }

    // Afficher les onglets et remplir le contenu, sans forcer le retour sur un onglet
    // si l'utilisateur a entre-temps navigué ailleurs pendant le chargement.
    if (mySession !== sessionId) return;
    classesLoaded = true;
    showTabs();
    renderSikkumTab();
    renderPresenceTab();
    activateTabUI(targetTab);
    if (targetTab === 'bakasha') renderBakasha();
    if (targetTab === 'annuaire') loadAnnuaire();
  } catch(e) {
    // Ne rien afficher si l'utilisateur s'est déconnecté entre-temps
    if (mySession === sessionId) setRoot(`<div class="error-msg">Erreur : ${e.message}</div>`);
  } finally {
    if (mySession === sessionId) classesLoading = false;
  }
}

}

// ── Passage en mode édition d'une classe déjà envoyée ──
function enableEditClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  const block = document.getElementById(`block-${classId}`);
  if (!cls || !block) return;

  block.classList.add('open');

  block.querySelectorAll('input, textarea, select').forEach(el => el.disabled = false);

  const recs = state.rapportRecords[classId] || [];
  if (recs.length) {
    const first = recs[0].fields;
    const perekEl = document.getElementById(`perek-${classId}`);
    if (perekEl && first['fldR4g4kg2q3t1BPr'] != null) perekEl.value = first['fldR4g4kg2q3t1BPr'];
    const contenuEl = document.getElementById(`contenu-${classId}`);
    if (contenuEl) contenuEl.value = first['fldMJlONdkB6SJANA'] || '';
    const remarquesEl = document.getElementById(`remarques-${classId}`);
    if (remarquesEl) remarquesEl.value = first['fldD7fivLb4cV91Uc'] || '';
  }
  for (const r of recs) {
    const name = (r.fields['fldv20CiFCcpI5D0a'] || '').trim();
    const sid = cls.studentIds.find(id => (state.students[id] || '').trim() === name);
    if (!sid) continue;
    const evalEl = document.getElementById(`eval-${classId}-${sid}`);
    if (evalEl) evalEl.value = r.fields['fldBkPM3GLSEh9ocV'] || '';
    const passEl = document.getElementById(`passage-${classId}-${sid}`);
    if (passEl) passEl.value = r.fields['fldsjADeAmUvt8zvO'] || '';
  }

  const btn = document.getElementById(`btn-${classId}`);
  if (btn) {
    btn.disabled = false;
    btn.classList.remove('done');
    btn.textContent = '✎ עדכון ושמירה';
  }
  const note = block.querySelector('.submit-class-note');
  if (note) note.textContent = 'מצב עריכה — השינויים יעדכנו את הדוח הקיים ב-Airtable';

  block.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function submitClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  const isEditing = !!(state.rapportRecords[classId] && state.rapportRecords[classId].length);
  const btn = document.getElementById(`btn-${classId}`);
  if (btn) { btn.disabled = true; btn.textContent = isEditing ? 'מעדכן...' : 'שומר...'; }

  const now       = new Date().toISOString();
  const perek     = document.getElementById(`perek-${classId}`)?.value;
  const contenu   = document.getElementById(`contenu-${classId}`)?.value || '';
  const remarques = document.getElementById(`remarques-${classId}`)?.value || '';

  const existingByName = {};
  if (isEditing) {
    for (const r of state.rapportRecords[classId]) {
      const n = (r.fields['fldv20CiFCcpI5D0a'] || '').trim();
      if (n) existingByName[n] = r.id;
    }
  }

  const toCreate = [];
  const toUpdate = [];
  for (const sid of cls.studentIds) {
    const name = state.students[sid] || sid;
    const pres = state.presences[`${name}__${cls.num}`];
    const fields = {
      'fldv20CiFCcpI5D0a': name,
      'fld5pPY7sfAzWNFJB': cls.num,
      'fldUqnBJ4rcoXUZw1': state.teacher.name,
      'fldcnIaGnFqbmvgCk': typeof pres === 'number' ? pres : 0,
      'fldBkPM3GLSEh9ocV': document.getElementById(`eval-${classId}-${sid}`)?.value || '',
      'fldsjADeAmUvt8zvO': document.getElementById(`passage-${classId}-${sid}`)?.value || null,
      'fldR4g4kg2q3t1BPr': perek ? parseInt(perek) : null,
      'fldMJlONdkB6SJANA': contenu,
      'fldD7fivLb4cV91Uc': remarques,
      'fldjrcq6Y3qfsICAi': now
    };
    const existingId = existingByName[name];
    if (existingId) toUpdate.push({ id: existingId, fields });
    else toCreate.push({ fields });
  }

  try {
    const savedRecords = [];
    for (let i = 0; i < toUpdate.length; i += 10) {
      const res = await api(BASE_COURS, TABLE_RAPPORTS, '', 'PATCH', { records: toUpdate.slice(i, i + 10), returnFieldsByFieldId: true });
      savedRecords.push(...(res.records || []));
    }
    for (let i = 0; i < toCreate.length; i += 10) {
      const res = await api(BASE_COURS, TABLE_RAPPORTS, '', 'POST', { records: toCreate.slice(i, i + 10), returnFieldsByFieldId: true });
      savedRecords.push(...(res.records || []));
    }

    sentClasses[classId] = 'sent';
    state.rapportRecords[classId] = savedRecords;

    renderSikkumTab();

    const nextCls = state.classes.find(c => !sentClasses[c.id]);
    if (nextCls) {
      const nextBlock = document.getElementById(`block-${nextCls.id}`);
      if (nextBlock) nextBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      document.getElementById('tab-sikkum')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = isEditing ? '✎ עדכון ושמירה' : '✉ שמירה ושליחה'; }
    document.getElementById(`block-${classId}`)?.insertAdjacentHTML('afterbegin', `<div class="error-msg" style="margin:0.75rem 1.25rem;">Erreur : ${e.message}</div>`);
  }
}

// ── ONGLET 3 : נוכחות (présence quotidienne) ──
function getTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function togglePresenceClass(classId) {
  const block = document.getElementById(`presblock-${classId}`);
  if (block) block.classList.toggle('open');
}

function buildStudentChecklist(cls, existingMap) {
  const sortedIds = [...cls.studentIds].sort((a, b) =>
    (state.students[a] || '').localeCompare(state.students[b] || '', 'he')
  );
  let html = '<div class="pres-students">';
  for (const sid of sortedIds) {
    const name = state.students[sid] || sid;
    const rec = existingMap[sid];
    const checked = rec ? rec.present : false;
    html += `<label class="pres-row"><input type="checkbox" class="pres-check" id="pc-${cls.id}-${sid}" ${checked ? 'checked' : ''} /> <span>${name}</span></label>`;
  }
  html += '</div>';
  return html;
}

function renderPresenceTab() {
  setTab('presence', buildPresenceHtml());
}

function buildPresenceHtml() {
  const t = state.teacher;
  const todayStr = getTodayStr();
  let html = `
    <div class="prof-header">

    html += `
    <div class="classe-block${doneToday ? ' sent' : ''}${isOpen ? ' open' : ''}" id="presblock-${cls.id}">
      <div class="classe-header" onclick="togglePresenceClass('${cls.id}')">

          <div class="classe-title">כיתה ${cls.num}</div>
          <div class="classe-tags">
            <span class="tag">${cls.studentIds.length} תלמידים</span>

          </div>
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="classe-body">
        <div class="infos-classe">
          <div class="field-group" style="max-width:200px;">
            <label class="field-label">תאריך</label>
            <input type="date" class="field-input" id="pres-date-${cls.id}" value="${todayStr}" onchange="onPresenceDateChange('${cls.id}')" />
          </div>
        </div>
        <div id="pres-error-${cls.id}"></div>
        <div id="pres-list-${cls.id}" style="padding:0.5rem 1.25rem;">
          ${buildStudentChecklist(cls, existingMap)}
        </div>

          <div class="submit-class-note">ניתן לתקן תאריך קודם על ידי שינוי השדה למעלה</div>

      <div style="font-family:'League Spartan',sans-serif;font-weight:700;color:#025db8;font-size:16px;margin-bottom:10px;">🔄 החלפת מורה — Remplacer un cours</div>
      <input type="text" class="field-input" id="remp-search" placeholder="מספר כיתה... (ex: 214)" oninput="onRemplacementSearch()" style="direction:ltr;" />
      <div id="remp-results" style="margin-top:10px;"></div>
    </div>`;

  return html;

async function onPresenceDateChange(classId) {
  const dateInput = document.getElementById(`pres-date-${classId}`);
  const dateStr = dateInput.value;
  await loadAndRenderPresenceChecklist(classId, dateStr);
}

async function loadAndRenderPresenceChecklist(classId, dateStr) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  const listEl = document.getElementById(`pres-list-${classId}`);
  if (listEl) listEl.innerHTML = `<div class="loading" style="padding:1rem;"><div class="spinner"></div></div>`;

  let existingMap = {};
  const todayStr = getTodayStr();
  if (dateStr === todayStr && state.presenceRecordsToday[classId]) {
    existingMap = state.presenceRecordsToday[classId];
  } else {
    try {
      const formula = encodeURIComponent(`AND({Classes}="${String(cls.num).replace(/"/g,'\\"')}",IS_SAME({Date},"${dateStr}",'day'))`);
      const recs = await getAll(BASE_COURS, TABLE_PRESENCES_JOUR, `?filterByFormula=${formula}&returnFieldsByFieldId=true`);
      for (const r of recs) {
        const sid = (r.fields[FLD_PRES_ELEVE] || [])[0];
        if (sid) existingMap[sid] = { recordId: r.id, present: !!r.fields[FLD_PRES_PRESENT] };
      }
    } catch (e) {
      const errEl = document.getElementById(`pres-error-${classId}`);
      if (errEl) errEl.innerHTML = `<div class="error-msg">Erreur : ${e.message}</div>`;
    }
  }

  state.presenceCache[classId] = { dateStr, existingMap };
  if (listEl) listEl.innerHTML = buildStudentChecklist(cls, existingMap);
  const badge = document.getElementById(`pres-status-${classId}`);
  const anyDone = Object.keys(existingMap).length > 0;
  if (badge) badge.style.display = anyDone ? 'inline-block' : 'none';
}

async function submitPresence(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  const dateStr = document.getElementById(`pres-date-${classId}`)?.value || getTodayStr();
  const cache = state.presenceCache[classId] || { existingMap: {} };
  const existingMap = cache.existingMap || {};
  const btn = document.getElementById(`pres-btn-${classId}`);
  if (btn) { btn.disabled = true; btn.textContent = 'שומר...'; }

  const isoDate = `${dateStr}T12:00:00.000Z`;
  const toCreate = [], toUpdate = [];
  for (const sid of cls.studentIds) {
    const checkEl = document.getElementById(`pc-${classId}-${sid}`);
    if (!checkEl) continue;
    const fields = {
      [FLD_PRES_ELEVE]: [sid],
      [FLD_PRES_CLASSE]: cls.num,
      [FLD_PRES_DATE]: isoDate,
      [FLD_PRES_PRESENT]: checkEl.checked,
      [FLD_PRES_PROF]: state.teacher.name
    };
    const existing = existingMap[sid];
    if (existing) toUpdate.push({ id: existing.recordId, fields });
    else toCreate.push({ fields });
  }

  try {
    for (let i = 0; i < toUpdate.length; i += 10) {
      await api(BASE_COURS, TABLE_PRESENCES_JOUR, '', 'PATCH', { records: toUpdate.slice(i, i + 10) });
    }
    for (let i = 0; i < toCreate.length; i += 10) {
      await api(BASE_COURS, TABLE_PRESENCES_JOUR, '', 'POST', { records: toCreate.slice(i, i + 10) });
    }
    await loadAndRenderPresenceChecklist(classId, dateStr);
    if (dateStr === getTodayStr()) {
      state.presenceRecordsToday[classId] = state.presenceCache[classId].existingMap;
      const block = document.getElementById(`presblock-${classId}`);
      if (block) block.classList.add('sent');
    }
    if (btn) {
      btn.disabled = false;
      btn.textContent = '✓ נשמר';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = '💾 שמירת נוכחות'; btn.classList.remove('done'); }, 1500);
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '💾 שמירת נוכחות'; }
    const errEl = document.getElementById(`pres-error-${classId}`);
    if (errEl) errEl.innerHTML = `<div class="error-msg">Erreur : ${e.message}</div>`;
  }
}

async function loadAllClassesLight() {
  const fieldsParam = ['Numéro de Classe', 'Teacher en texte', 'Status']
    .map(f => `fields%5B%5D=${encodeURIComponent(f)}`)
    .join('&');
  const recs = await getAll(BASE_COURS, TABLE_CLASSES, `?${fieldsParam}`);
  allClassesLight = recs
    .filter(r => ['Complete', 'In Progress'].includes(r.fields['Status']))
    .map(r => ({ id: r.id, num: r.fields['Numéro de Classe'] || r.id, teacher: r.fields['Teacher en texte'] || '' }));
}

async function onRemplacementSearch() {
  const q = (document.getElementById('remp-search')?.value || '').trim();
  const resultsEl = document.getElementById('remp-results');
  if (!resultsEl) return;
  if (!q) { resultsEl.innerHTML = ''; return; }
  if (!allClassesLight) {
    resultsEl.innerHTML = `<div class="loading" style="padding:0.5rem;"><div class="spinner"></div></div>`;
    try { await loadAllClassesLight(); }
    catch (e) { resultsEl.innerHTML = `<div class="error-msg">Erreur : ${e.message}</div>`; return; }
  }
  const matches = allClassesLight.filter(c => String(c.num).toLowerCase().includes(q.toLowerCase())).slice(0, 8);
  if (!matches.length) {
    resultsEl.innerHTML = `<div class="submit-class-note" style="padding:0.5rem 0;">לא נמצאה כיתה</div>`;
    return;
  }
  resultsEl.innerHTML = matches.map(c => `
    <div class="classe-block" style="cursor:pointer;margin-bottom:0.5rem;" onclick="selectRemplacementClass('${c.id}')">
      <div class="classe-header" style="background:#f55700;">
        <div class="classe-header-left">
          <div class="classe-title">כיתה ${c.num}</div>
          <div class="classe-tags"><span class="tag">${c.teacher || '—'}</span></div>
        </div>
      </div>
    </div>`).join('');
}

async function selectRemplacementClass(classId) {
  const light = allClassesLight?.find(c => c.id === classId);
  if (!light) return;
  const resultsEl = document.getElementById('remp-results');
  resultsEl.innerHTML = `<div class="loading" style="padding:0.5rem;"><div class="spinner"></div></div>`;
  try {
    const clsRec = await api(BASE_COURS, TABLE_CLASSES, `/${classId}`);
    const studentIds = clsRec.fields['Students'] || [];
    const missingIds = studentIds.filter(id => !state.students[id]);
    for (let i = 0; i < missingIds.length; i += 10) {
      const batch = missingIds.slice(i, i + 10);
      const formula = encodeURIComponent(`OR(${batch.map(id => `RECORD_ID()="${id}"`).join(',')})`);
      const res = await api(BASE_COURS, TABLE_STUDENTS, `?filterByFormula=${formula}`);
      for (const r of (res.records || [])) state.students[r.id] = (r.fields['Name'] || r.id).trim();
    }
    remplacementSelected = { id: classId, num: light.num, teacher: light.teacher, studentIds };
    renderRemplacementConfirm();
  } catch (e) {
    resultsEl.innerHTML = `<div class="error-msg">Erreur : ${e.message}</div>`;
  }
}

        city: (f[FLD_RH_CITY] || '').trim(),
        phone: (f[FLD_RH_PHONE] || '').trim(),
        email: (f[FLD_RH_EMAIL_PRO] || f[FLD_RH_EMAIL_PERSO] || '').trim(),
        status: (f[FLD_RH_STATUS] && f[FLD_RH_STATUS].name) || '',
        photoUrl: photo ? (photo.thumbnails?.large?.url || photo.url) : null,
        bookingUrl: (booking && booking.url) ? booking.url.trim() : ''
      };
    });
    annuaireLoaded = true;
    renderAnnuaireTab();
  } catch (e) {
    if (mySession === sessionId) setTab('annuaire', `<div class="error-msg">Erreur : ${e.message}</div>`);
  } finally {
    if (mySession === sessionId) annuaireLoading = false;
  }
}

function renderAnnuaireTab(filterText) {
  const q = (filterText || '').trim().toLowerCase();
  const list = q
    ? state.annuaire.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.role.toLowerCase().includes(q) ||
        p.city.toLowerCase().includes(q))
    : state.annuaire;

  let html = `
    <div style="margin-bottom:1rem;">
      <input type="text" class="bakasha-input" id="annuaire-search" placeholder="חיפוש לפי שם, תפקיד או עיר..." style="direction:ltr;" oninput="renderAnnuaireTab(this.value)" />
    </div>`;

  if (!list.length) {
    html += `<div class="annuaire-empty">לא נמצאו תוצאות</div>`;
  } else {
    html += `<div class="annuaire-grid">`;
    for (const p of list) {
      const initials = p.name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const photoHtml = p.photoUrl
        ? `<img class="annuaire-photo" src="${p.photoUrl}" alt="${p.name}" />`
        : `<div class="annuaire-photo-placeholder">${initials}</div>`;
      const statusClass = p.status === 'Active' ? 'active' : 'inactive';
      const statusLabel = p.status === 'Active' ? '✓ פעיל/ה' : (p.status || '—');
      html += `
        <div class="annuaire-card">
          ${photoHtml}
          <div class="annuaire-name">${p.name}</div>
          ${p.role ? `<div class="annuaire-role">${p.role}</div>` : ''}
          ${p.city ? `<div class="annuaire-meta">📍 ${p.city}</div>` : ''}
          ${p.phone ? `<div class="annuaire-meta">📞 ${p.phone}</div>` : ''}
          ${p.email ? `<div class="annuaire-meta">✉️ ${p.email}</div>` : ''}
          <div class="annuaire-status ${statusClass}">${statusLabel}</div>
          ${p.bookingUrl ? `<div><a class="annuaire-booking" href="${p.bookingUrl}" target="_blank" rel="noopener">📅 קביעת פגישה</a></div>` : ''}
        </div>`;
    }
    html += `</div>`;
  }
  setTab('annuaire', html);
  const input = document.getElementById('annuaire-search');
  if (input && filterText !== undefined) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

// ── ONGLET 5 : VOS CLASSES ──
let lieuxMap = null;

async function loadLieuxMap() {
  if (lieuxMap) return lieuxMap;
  const recs = await getAll(BASE_COURS, TABLE_LIEUX, `?returnFieldsByFieldId=true`);
  lieuxMap = {};
  for (const r of recs) lieuxMap[r.id] = (r.fields[FLD_LIEU_NAME] || '').trim();
  return lieuxMap;
}

function formatFrDate(iso) {
  if (!iso) return '';
  const parts = String(iso).split('-');
  if (parts.length !== 3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

async function loadMesClasses() {
  if (mesclassesLoaded || mesclassesLoading) { renderMesClassesTab(); return; }
  if (!state.teacher || !state.teacher.classIds.length) {
    setTab('mesclasses', `<div class="annuaire-empty">לא נמצאו כיתות</div>`);
    return;
  }
  const mySession = sessionId;
  mesclassesLoading = true;
  setTab('mesclasses', `<div class="loading"><div class="spinner"></div><br>טוען את הכיתות שלך...</div>`);
  try {
    const lieux = await loadLieuxMap();
    if (mySession !== sessionId) return;
    const records = [];
    for (let i = 0; i < state.teacher.classIds.length; i += 10) {
      const batch = state.teacher.classIds.slice(i, i + 10);
      const res = await api(BASE_COURS, TABLE_CLASSES, `?filterByFormula=${encodeURIComponent(`OR(${batch.map(id => `RECORD_ID()="${id}"`).join(',')})`)}&returnFieldsByFieldId=true`);
      records.push(...(res.records || []));
    }
    if (mySession !== sessionId) return;
    state.mesclasses = records.map(r => {
      const f = r.fields;
      const endroitIds = f[FLD_CL_ENDROIT] || [];
      const endroitNames = endroitIds.map(id => lieux[id] || id).filter(Boolean);
      const debute = (f[FLD_CL_DEBUTE] || [])[0];
      const termine = (f[FLD_CL_TERMINE] || [])[0];
      return {
        id: r.id,
        num: f[FLD_CL_NUM] || '',
        autoId: f[FLD_CL_AUTOID] || '',
        ancienne: f[FLD_CL_ANCIENNE] || '',
        type: (f[FLD_CL_TYPE] && f[FLD_CL_TYPE].name) || '',
        endroit: endroitNames.join(', '),
        hours: f[FLD_CL_HOURS] != null ? f[FLD_CL_HOURS] : '',
        niveau: (f[FLD_CL_NIVEAU] && f[FLD_CL_NIVEAU].name) || '',
        chapitre: f[FLD_CL_CHAPITRE] || '',
        jour: f[FLD_CL_JOUR_TEXT] || '',
        horaires: f[FLD_CL_HORAIRES] || '',
        debute: formatFrDate(debute),
        termine: formatFrDate(termine),
        status: (f[FLD_CL_STATUS] && f[FLD_CL_STATUS].name) || '',
        studentsCount: (f[FLD_CL_STUDENTS] || []).length,
        fiche: f[FLD_CL_FICHE] || ''
      };
    });
    mesclassesLoaded = true;
    renderMesClassesTab();
  } catch (e) {
    if (mySession === sessionId) setTab('mesclasses', `<div class="error-msg">Erreur : ${e.message}</div>`);
  } finally {
    if (mySession === sessionId) mesclassesLoading = false;
  }
}

function statusCssClass(status) {
  if (status === 'Complete') return 'complete';
  if (status === 'In Progress') return 'inprogress';
  if (status === 'Upcoming') return 'upcoming';
  return 'creation';
}

  errDiv.innerHTML = '';

    'המשך שיעורים קיימים':          document.getElementById('bk-continue')?.value || '',
    'שיעורים שאינך רוצה להמשיך':   document.getElementById('bk-stop')?.value || '',
